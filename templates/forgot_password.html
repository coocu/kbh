<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ academy_name }} 비밀번호 찾기</title>
  <style>
    :root { color-scheme:light dark; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif; }
    html,body { width:100%; min-height:100%; margin:0; }
    body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:Canvas; color:CanvasText; }
    .card { width:min(420px,calc(100vw - 40px)); border:1px solid color-mix(in srgb,CanvasText 20%,transparent); border-radius:24px; padding:28px; box-shadow:0 16px 50px rgba(0,0,0,.12); }
    h1 { margin:0 0 6px; font-size:26px; }
    p { margin:0 0 22px; opacity:.7; font-size:14px; }
    input,button { width:100%; box-sizing:border-box; border-radius:14px; font-size:17px; padding:14px 16px; }
    input { border:1px solid color-mix(in srgb,CanvasText 25%,transparent); background:Canvas; color:CanvasText; margin-bottom:12px; }
    button { border:0; background:#0a84ff; color:#fff; font-weight:700; cursor:pointer; }
    .back { display:block; text-align:center; margin-top:16px; color:#0a84ff; text-decoration:none; font-size:14px; }
    .notice { border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:13px; background:color-mix(in srgb,#ff453a 15%,transparent); color:#ff6961; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/admin/forgot/verify">
    <h1>비밀번호 찾기</h1>
    <p>관리자 확인 정보를 입력해 주세요.</p>

    {% if error %}
      <div class="notice">입력한 정보를 확인해 주세요.</div>
    {% endif %}
    {% if not_configured %}
      <div class="notice">비밀번호 찾기 정보가 서버에 설정되어 있지 않습니다.</div>
    {% endif %}

    <input name="name" autocomplete="name" placeholder="성함" required autofocus>
    <input name="phone_last4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="전화번호 끝 4자리" required>
    <input name="developer_name" autocomplete="off" placeholder="개발자명" required>
    <button type="submit">확인</button>
    <a class="back" href="/admin">로그인으로 돌아가기</a>
  </form>
</body>
</html>
