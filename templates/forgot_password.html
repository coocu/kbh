<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>관리자 비밀번호 찾기</title>
  <style>
    :root { color-scheme:light dark; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; }
    body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:Canvas; color:CanvasText; padding:20px; }
    .card { width:min(430px,100%); border:1px solid color-mix(in srgb,CanvasText 20%,transparent); border-radius:24px; padding:28px; box-shadow:0 16px 50px rgba(0,0,0,.12); }
    h1 { margin:0 0 6px; font-size:26px; }
    p { margin:0 0 22px; opacity:.7; font-size:14px; }
    input,select,button { width:100%; box-sizing:border-box; border-radius:14px; font-size:17px; padding:14px 16px; }
    input,select { border:1px solid color-mix(in srgb,CanvasText 25%,transparent); background:Canvas; color:CanvasText; margin-bottom:12px; }
    button { border:0; background:#0a84ff; color:#fff; font-weight:700; cursor:pointer; }
    .back { display:block; text-align:center; margin-top:16px; color:#0a84ff; text-decoration:none; font-size:14px; }
    .issue { display:block; text-align:center; margin-top:12px; padding:12px 14px; border:1px solid color-mix(in srgb,#0a84ff 50%,transparent); border-radius:14px; color:#0a84ff; text-decoration:none; font-weight:700; }
    .notice { border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:13px; background:color-mix(in srgb,#ff453a 15%,transparent); color:#ff6961; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/admin/forgot/verify">
    <h1>비밀번호 찾기</h1>
    <p>학원, 최초 등록 관리자 정보와 인증키를 확인합니다.</p>

    {% if error == 'server' %}
      <div class="notice">인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.</div>
    {% elif error %}
      <div class="notice">학원, 성함, 전화번호 끝 4자리 또는 인증키를 확인해 주세요.</div>
    {% endif %}

    <select name="academy_id" required autofocus>
      <option value="">학원 선택</option>
      {% for academy in academies %}
        <option value="{{ academy.id }}" {% if selected_academy_id|string == academy.id|string %}selected{% endif %}>{{ academy.name }}</option>
      {% endfor %}
    </select>
    <input name="name" autocomplete="name" placeholder="최초 관리자 성함" required>
    <input name="phone_last4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="전화번호 끝 4자리" required>
    <input name="license_key" autocomplete="off" placeholder="인증키" required>
    <button type="submit">본인 확인</button>
    <a class="issue" href="https://naver.me/xWI8fCzo">인증키 발급</a>
    <a class="back" href="/admin">로그인으로 돌아가기</a>
  </form>
</body>
</html>
